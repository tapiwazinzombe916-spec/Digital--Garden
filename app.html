<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F6F2E9">
<title>Digital Garden</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ============================================
   Digital Garden — Design Tokens
   ============================================ */
:root{
  /* Color */
  --ink:        #1B2B22;
  --ink-soft:   #4B5A50;
  --paper:      #F6F2E9;
  --paper-raised: #FFFFFF;
  --mist:       #E8E2D2;
  --canopy:     #2F6B4F;
  --canopy-dark:#1F4E39;
  --harvest:    #C98A2E;
  --clay:       #B5542B;
  --line:       rgba(27, 43, 34, 0.10);

  /* Type — system stacks only, so it renders identically with no connection */
  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', Consolas, monospace;

  /* Layout */
  --tabbar-h: 64px;
  --topbar-h: 56px;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  height:100%;
}

button{ font-family:inherit; border:none; background:none; cursor:pointer; color:inherit; }
a{ color:inherit; text-decoration:none; }

/* ============ Top bar ============ */
.topbar{
  position:sticky; top:0; z-index:20;
  height:var(--topbar-h);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 18px;
  background:rgba(246,242,233,0.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{ display:flex; align-items:center; gap:8px; }
.brand-mark{ font-size:20px; }
.brand-name{
  font-family:var(--font-display);
  font-weight:600;
  font-size:19px;
  letter-spacing:-0.01em;
}
.icon-btn{ position:relative; padding:6px; color:var(--ink); }
.badge-dot{
  position:absolute; top:4px; right:4px;
  width:8px; height:8px; border-radius:50%;
  background:var(--clay);
  border:1.5px solid var(--paper);
}

/* ============ Feed ============ */
.feed{
  padding:16px 16px calc(var(--tabbar-h) + 28px);
  max-width:520px;
  margin:0 auto;
}

.greeting{ padding:10px 4px 18px; }
.eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:600;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--canopy);
  margin-bottom:4px;
}
.greeting h1{
  font-family:var(--font-display);
  font-weight:600;
  font-size:26px;
  letter-spacing:-0.01em;
}

.card{
  background:var(--paper-raised);
  border-radius:var(--radius-lg);
  border:1px solid var(--line);
  padding:20px;
  margin-bottom:22px;
}

/* Portfolio stat card */
.stat-row{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
.stat-label{ font-size:13px; color:var(--ink-soft); margin-bottom:4px; }
.stat-figure{
  font-family:var(--font-mono);
  font-size:30px;
  font-weight:600;
  letter-spacing:-0.02em;
}
.stat-change{
  font-family:var(--font-mono);
  font-size:12px; font-weight:600;
  padding:4px 9px; border-radius:20px;
  background:var(--mist); color:var(--ink-soft);
}
.stat-change--up{ background:rgba(47,107,79,0.14); color:var(--canopy); }
.stat-change--down{ background:rgba(181,84,43,0.14); color:var(--clay); }
.stat-actions{ display:flex; gap:10px; }

/* Live indicator dot */
.live-dot{
  display:inline-block; width:6px; height:6px; border-radius:50%;
  background:var(--canopy); margin-left:6px; vertical-align:middle;
  animation:pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot{
  0%, 100%{ opacity:1; }
  50%{ opacity:0.3; }
}

/* Portfolio chart */
.portfolio-chart{
  width:100%; height:120px;
  display:block;
  margin-bottom:16px;
}

/* Amount modal */
.amount-modal{
  position:fixed; inset:0; z-index:110;
  display:flex; align-items:center; justify-content:center;
  background:rgba(27,43,34,0.4);
  padding:24px;
}
.amount-modal[hidden]{ display:none; }
.amount-modal-card{
  width:100%; max-width:340px;
  background:var(--paper-raised);
  border-radius:var(--radius-lg);
  padding:24px;
}
.amount-modal-title{
  font-family:var(--font-display); font-weight:600; font-size:18px;
  margin-bottom:16px;
}
.amount-modal-actions{ display:flex; gap:10px; margin-top:4px; }
.ecocash-toggle{
  display:flex; align-items:center; gap:8px;
  font-size:13px; color:var(--ink-soft); margin:4px 0 14px;
}
.ecocash-toggle input{ width:16px; height:16px; }
.create-form .field:first-child{ margin-top:16px; }
.create-form[hidden]{ display:none; }

.task-item{ align-items:center; }
.task-actions{ display:flex; gap:8px; }
.task-btn{
  font-size:11px; font-weight:600; padding:8px 14px;
  border-radius:100px; white-space:nowrap;
}
.task-btn--claim{ background:var(--canopy); color:#fff; }
.task-btn--done{ background:var(--harvest); color:#fff; }
.task-btn--taken{ background:var(--mist); color:var(--ink-soft); }
.task-btn:disabled{ opacity:0.6; }
.pill{
  flex:1;
  padding:11px 0;
  border-radius:100px;
  font-size:14px; font-weight:600;
  background:var(--mist); color:var(--ink);
  text-align:center;
}
.pill--primary{ background:var(--canopy); color:#fff; }

/* ============ Rails (horizontal scroll) ============ */
.rail-section{ margin-bottom:26px; }
.rail-heading{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; padding:0 2px; }
.rail-heading h2{ font-family:var(--font-display); font-size:18px; font-weight:600; }
.see-all{ font-size:12px; font-weight:600; color:var(--canopy); background:none; border:none; padding:0; }

.rail{
  display:flex; gap:12px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  padding-bottom:4px;
  -webkit-overflow-scrolling:touch;
}
.rail::-webkit-scrollbar{ display:none; }
.rail--expanded{ flex-wrap:wrap; overflow-x:visible; }
.rail--expanded .store-card{ flex:0 0 calc(50% - 6px); }

.store-card{
  scroll-snap-align:start;
  flex:0 0 138px;
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:14px 12px;
}
.store-card .ring{ margin-bottom:10px; }
.store-card .store-name{ font-size:13px; font-weight:600; margin-bottom:2px; }
.store-card .store-cat{ font-size:11px; color:var(--ink-soft); margin-bottom:8px; }
.store-card .store-price{ font-family:var(--font-mono); font-size:13px; font-weight:600; color:var(--canopy); }

/* Growth ring — signature element.
   Fill state communicates verification stage:
   unverified -> pending -> verified */
.ring{
  --ring-color: var(--mist);
  width:44px; height:44px;
  border-radius:50%;
  display:inline-flex; align-items:center; justify-content:center;
  background: conic-gradient(var(--ring-color) 360deg);
  padding:3px;
}
.ring--pending{ --ring-color: linear-gradient(var(--harvest), var(--harvest)); background: conic-gradient(var(--harvest) 0deg 180deg, var(--mist) 180deg 360deg); }
.ring--verified{ background: conic-gradient(var(--canopy) 360deg); }
.avatar{
  width:100%; height:100%;
  background:var(--paper-raised);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:600; font-size:16px;
  color:var(--ink);
}

/* ============ Task list ============ */
.task-list{ display:flex; flex-direction:column; gap:10px; }
.task-item{
  display:flex; justify-content:space-between; align-items:center;
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:14px 16px;
}
.task-info h3{ font-size:14px; font-weight:600; margin-bottom:3px; }
.task-info p{ font-size:12px; color:var(--ink-soft); }
.task-pay{ font-family:var(--font-mono); font-weight:600; color:var(--harvest); font-size:14px; white-space:nowrap; }

/* ============ Community posts ============ */
.post-list{ display:flex; flex-direction:column; gap:14px; }
.post{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:16px;
}
.post-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.post-head .ring{ width:34px; height:34px; }
.post-head .avatar{ font-size:13px; }
.post-name{ font-size:13px; font-weight:600; }
.post-time{ font-size:11px; color:var(--ink-soft); }
.post-body{ font-size:14px; line-height:1.5; color:var(--ink); }

/* ============ Offline banner ============ */
.offline-banner{
  text-align:center;
  font-size:12px;
  color:var(--ink-soft);
  background:var(--mist);
  border-radius:100px;
  padding:9px 14px;
  margin-top:6px;
}

/* ============ Bottom tab bar ============ */
.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  height:var(--tabbar-h);
  display:flex; align-items:center; justify-content:space-around;
  background:rgba(246,242,233,0.94);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  padding:10px 18px;
  color:var(--ink-soft);
  display:flex; align-items:center; justify-content:center;
}
.tab--active{ color:var(--ink); }
.tab--create svg{ background:var(--canopy); color:#fff; border-radius:8px; padding:3px; }
.tab .ring{ width:30px; height:30px; }
.tab .avatar{ font-size:12px; }

/* ============ Auth screen ============ */
.auth-screen{
  position:fixed; inset:0; z-index:100;
  display:flex; align-items:center; justify-content:center;
  background:var(--paper);
  padding:24px;
}
.auth-screen[hidden]{ display:none; }
.auth-card{
  width:100%; max-width:380px;
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:28px 24px;
}
.auth-tabs{
  display:flex; background:var(--mist); border-radius:100px;
  padding:4px; margin-bottom:22px;
}
.auth-tab{
  flex:1; padding:9px 0; border-radius:100px;
  font-size:13px; font-weight:600; color:var(--ink-soft);
}
.auth-tab--active{ background:var(--paper-raised); color:var(--ink); }
.field{ margin-bottom:14px; }
.field label{
  display:block; font-size:12px; font-weight:600;
  color:var(--ink-soft); margin-bottom:6px;
}
.field input{
  width:100%; padding:12px 14px;
  border:1px solid var(--line); border-radius:var(--radius-sm);
  background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:14px;
}
.field input:focus{ outline:2px solid var(--canopy); outline-offset:1px; }
.auth-error{
  font-size:12px; color:var(--clay);
  background:rgba(181,84,43,0.1);
  padding:9px 12px; border-radius:var(--radius-sm);
  margin-bottom:14px;
}

/* Header avatar (replaces bell) */
.header-avatar{ padding:0; }
.header-avatar .ring{ width:36px; height:36px; }
.header-avatar .avatar{ font-size:13px; }

/* Page system — one full-screen page visible at a time */
.page{ display:none; }
.page--active{ display:block; }
.page-header{
  display:flex; align-items:center; gap:12px;
  margin-bottom:20px;
}
.page-header h1{ font-family:var(--font-display); font-weight:600; font-size:22px; }
.page-back{
  width:34px; height:34px;
  display:flex; align-items:center; justify-content:center;
  background:var(--paper-raised); border:1px solid var(--line);
  border-radius:50%; font-size:16px; color:var(--ink);
}
.store-grid{
  display:flex; flex-wrap:wrap; gap:12px;
  overflow-x:visible; scroll-snap-type:none;
}
.store-grid .store-card{ flex:0 0 calc(50% - 6px); }

/* Profile page block (was a floating panel, now a normal page) */
.profile-panel-inner{ display:flex; flex-direction:column; }
.profile-name{ font-family:var(--font-display); font-weight:600; font-size:16px; margin-top:10px; }
.profile-email{ font-size:12px; color:var(--ink-soft); margin-top:2px; word-break:break-all; }
.profile-status{
  font-family:var(--font-mono); font-size:10px; font-weight:600;
  text-transform:uppercase; letter-spacing:0.06em;
  color:var(--canopy); background:var(--mist);
  padding:4px 10px; border-radius:100px; margin-top:10px;
}

.verify-block{
  width:100%; margin-top:16px; padding-top:16px;
  border-top:1px solid var(--line);
  text-align:left;
}
.verify-heading{
  font-family:var(--font-mono); font-size:10px; font-weight:600;
  letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-soft);
  margin-bottom:6px;
}
.verify-store-name{ font-size:14px; font-weight:600; }
.verify-store-status{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
.verify-note{
  font-size:11px; color:var(--canopy); margin-top:8px;
  background:rgba(47,107,79,0.1); padding:8px 10px; border-radius:var(--radius-sm);
}
.pill:disabled{ opacity:0.5; }

.admin-block{
  width:100%; margin-top:16px; padding-top:16px;
  border-top:1px solid var(--line);
  text-align:left;
}
.admin-request{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:10px 12px;
  margin-bottom:8px;
}
.admin-request-name{ font-size:12px; font-weight:600; margin-bottom:6px; }
.admin-request-actions{ display:flex; gap:6px; }
.admin-request-actions button{
  flex:1; font-size:11px; font-weight:600; padding:6px 0; border-radius:8px;
}
.btn-approve{ background:var(--canopy); color:#fff; }
.btn-reject{ background:var(--mist); color:var(--ink); }

/* Search bar */
.search-bar{
  display:flex; align-items:center; gap:10px;
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:100px;
  padding:12px 16px;
  margin-bottom:20px;
  color:var(--ink-soft);
}
.search-bar input{
  border:none; outline:none; background:none;
  font-family:var(--font-body); font-size:14px; color:var(--ink);
  flex:1;
}

/* Quick action grid */
.action-grid{
  display:grid; grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:22px;
}
.action-card{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:16px 14px;
  text-align:left;
  display:flex; flex-direction:column; gap:8px;
  min-height:88px;
}
.action-icon{
  width:34px; height:34px;
  border-radius:10px;
  background:var(--mist);
  color:var(--canopy);
  display:flex; align-items:center; justify-content:center;
}
.action-title{ font-size:13px; font-weight:600; color:var(--ink); }
.action-sub{ font-size:11px; color:var(--ink-soft); }

@media (min-width:600px){
  .feed{ padding-top:24px; }
}

</style>
</head>
<body>

  <!-- Auth gate — shown when no active session -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="brand" style="justify-content:center; margin-bottom:22px;">
        <span class="brand-mark">🌿</span>
        <span class="brand-name">Digital Garden</span>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab auth-tab--active" data-mode="login">Log in</button>
        <button class="auth-tab" data-mode="signup">Sign up</button>
      </div>

      <form id="authForm">
        <div class="field" id="nameField" hidden>
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" placeholder="Tendai Moyo" autocomplete="name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required minlength="6">
        </div>
        <p class="auth-error" id="authError" hidden></p>
        <button type="submit" class="pill pill--primary" style="width:100%; padding:13px 0;" id="authSubmit">Log in</button>
      </form>
    </div>
  </div>

  <!-- Main app (hidden until authenticated) -->
  <div id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🌿</span>
      <span class="brand-name">Digital Garden</span>
    </div>
    <button class="header-avatar" id="headerAvatarBtn" aria-label="View profile">
      <span class="ring ring--verified" id="headerRing">
        <span class="avatar" id="headerInitials">T</span>
      </span>
    </button>
  </header>

  <!-- Feed: a stack of full-screen pages, one active at a time -->
  <main class="feed" id="feed">

    <!-- ============ HOME ============ -->
    <section class="page page--active" id="page-home">
      <section class="greeting">
        <p class="eyebrow">Home</p>
        <h1 id="greetingName">Welcome back</h1>
      </section>

      <button class="search-bar" id="homeSearchShortcut" style="width:100%; text-align:left;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Search for products</span>
      </button>

      <section class="action-grid">
        <button class="action-card" data-action="invest">
          <span class="action-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>
          </span>
          <span class="action-title">Invest</span>
          <span class="action-sub">Buy stocks or product</span>
        </button>
        <button class="action-card" data-action="performance">
          <span class="action-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="12" width="4" height="8"/><rect x="10" y="7" width="4" height="13"/><rect x="16" y="3" width="4" height="17"/></svg>
          </span>
          <span class="action-title">View performance</span>
        </button>
        <button class="action-card" data-action="discover">
          <span class="action-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m14.5 9.5-5 2 5 2 2-5-2 1z"/></svg>
          </span>
          <span class="action-title">Discover more markets</span>
        </button>
        <button class="action-card" data-action="tasks">
          <span class="action-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </span>
          <span class="action-title">Micro-tasks</span>
        </button>
      </section>
    </section>

    <!-- ============ MARKET (also the Search destination) ============ -->
    <section class="page" id="page-market">
      <div class="page-header">
        <button class="page-back" data-back aria-label="Back">←</button>
        <h1>Market</h1>
      </div>
      <form class="search-bar" id="searchForm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search for products" autocomplete="off">
      </form>
      <div class="rail store-grid" id="storeRail"><!-- injected by app.js --></div>
    </section>

    <!-- ============ TASKS ============ -->
    <section class="page" id="page-tasks">
      <div class="page-header">
        <button class="page-back" data-back aria-label="Back">←</button>
        <h1>Micro-tasks</h1>
      </div>
      <div class="task-list" id="taskList"><!-- injected by app.js --></div>
    </section>

    <!-- ============ COMMUNITY ============ -->
    <section class="page" id="page-community">
      <div class="page-header">
        <button class="page-back" data-back aria-label="Back">←</button>
        <h1>Community</h1>
        <button class="pill pill--primary" id="newPostBtn" style="width:auto; padding:8px 16px; margin-left:auto;">New post</button>
      </div>
      <div class="post-list" id="postList"><!-- injected by app.js --></div>
    </section>

    <!-- ============ PERFORMANCE ============ -->
    <section class="page" id="page-performance">
      <div class="page-header">
        <button class="page-back" data-back aria-label="Back">←</button>
        <h1>Performance</h1>
      </div>
      <section class="card card--stat" id="statCard">
        <div class="stat-row">
          <div>
            <p class="stat-label">
              Portfolio value
              <span class="live-dot" id="liveDot" title="Realtime"></span>
            </p>
            <p class="stat-figure" id="statFigure">$0.00</p>
          </div>

function ringClass(status){
  if(status === 'verified') return 'ring ring--verified';
  if(status === 'pending') return 'ring ring--pending';
  return 'ring';
}
function initials(name){
  return (name || '?').split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
}
function timeAgo(dateStr){
  const diff = Math.floor((Date.now() - new Date(dateStr)) / 1000);
  if(diff < 3600) return Math.max(1, Math.floor(diff/60)) + 'm ago';
  if(diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}

// In-memory cache of the last rendered stores/tasks so the store-detail
// modal and task action buttons can look up full records by id without
// a network round trip.
let storeCache = {};
let taskCache = {};

function renderStores(stores){
  storeCache = {};
  stores.forEach(s => { if(s.id) storeCache[s.id] = s; });
  document.getElementById('storeRail').innerHTML = stores.map(s => `
    <div class="store-card" ${s.id ? `data-store-id="${s.id}"` : ''}>
      <span class="${ringClass(s.verified)}"><span class="avatar">${initials(s.name)}</span></span>
      <p class="store-name">${s.name}</p>
      <p class="store-cat">${s.cat}</p>
      <p class="store-price">${s.price}</p>
    </div>
  `).join('');
}

function taskActionHtml(t){
  if(!t.id) return `<div class="task-pay">${t.pay}</div>`;
  if(t.status === 'open'){
    return `<button class="task-btn task-btn--claim" data-claim-task="${t.id}">Claim</button>`;
  }
  if(t.status === 'claimed'){
    if(t.claimed_by === currentUserId){
      return `<button class="task-btn task-btn--done" data-complete-task="${t.id}">Mark done</button>`;
    }
    return `<span class="task-btn task-btn--taken">Claimed</span>`;
  }
  return `<span class="task-btn task-btn--taken">✓ Done</span>`;
}

function renderTasks(tasks){
  taskCache = {};
  tasks.forEach(t => { if(t.id) taskCache[t.id] = t; });
  document.getElementById('taskList').innerHTML = tasks.map(t => `
    <div class="task-item">
      <div class="task-info"><h3>${t.title}</h3><p>${t.loc}</p></div>
      <div class="task-actions">${taskActionHtml(t)}</div>

function renderPosts(posts){
  document.getElementById('postList').innerHTML = posts.map(p => `
    <div class="post">
      <div class="post-head">
        <span class="ring ring--verified"><span class="avatar">${initials(p.name)}</span></span>

      </div>
      <p class="post-body">${p.body}</p>
    </div>
  `).join('');
}
function renderFeed(data){
  renderStores(data.stores);
  renderTasks(data.tasks);
  renderPosts(data.posts);
}

// ---- Data loading: real Supabase queries, mapped into the same shape the UI expects ----
async function loadFeed(limitOverride){
  const n = limitOverride || 10;
  if(!isConfigured || !navigator.onLine){
    const cached = localStorage.getItem(STORAGE_KEY);
    renderFeed(cached ? JSON.parse(cached) : sampleData);
    return;
  }
  try{
    const [storesRes, tasksRes, postsRes] = await Promise.all([
      client.from('stores').select('id, name, category, price_label, verification_status').order('created_at', { ascending: false }).limit(n),
      client.from('tasks').select('id, title, location_label, pay_amount, status, claimed_by').order('created_at', { ascending: false }).limit(n),
      client.from('posts').select('body, created_at, profiles(full_name)').order('created_at', { ascending: false }).limit(n),
    ]);

    const data = {
      stores: (storesRes.data || []).map(s => ({ id: s.id, name: s.name, cat: s.category, price: s.price_label, verified: s.verification_status })),
      tasks: (tasksRes.data || []).map(t => ({ id: t.id, title: t.title, loc: t.location_label, pay: `$${t.pay_amount}`, status: t.status, claimed_by: t.claimed_by })),
      posts: (postsRes.data || []).map(p => ({ name: p.profiles?.full_name || 'Gardener', time: timeAgo(p.created_at), body: p.body })),
    };

    if(!data.stores.length && !data.tasks.length && !data.posts.length){
      renderFeed(sampleData); // fresh DB with no rows yet — show sample so the layout isn't empty
    } else {
      renderFeed(data);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }
  }catch(e){
    const cached = localStorage.getItem(STORAGE_KEY);
    renderFeed(cached ? JSON.parse(cached) : sampleData);
  }
}

// ============================================================
// Portfolio — live chart backed by the transactions ledger
// ============================================================
let portfolioPoints = [];   // [{ t: Date, v: cumulative value }]
let portfolioChannel = null;

function computeCumulative(rows){
  let running = 0;
  return rows.map(r => {
    running += Number(r.delta_amount);
    return { t: new Date(r.created_at), v: running };
  });
}

function drawChart(points){
  const canvas = document.getElementById('portfolioChart');
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 300;
  const h = 120;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  if(points.length < 2){
    ctx.strokeStyle = 'rgba(27,43,34,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, h - 20);
    ctx.lineTo(w, h - 20);
    ctx.stroke();
    return;
  }

  const values = points.map(p => p.v);
  const min = Math.min(...values, 0);
  const max = Math.max(...values, 0.01);
  const range = max - min || 1;
  const pad = 10;

  const x = i => pad + (i / (points.length - 1)) * (w - pad * 2);
  const y = v => h - pad - ((v - min) / range) * (h - pad * 2);

  const rising = values[values.length - 1] >= values[0];
  ctx.strokeStyle = rising ? '#2F6B4F' : '#B5542B';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  points.forEach((p, i) => {
    const px = x(i), py = y(p.v);
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  });
  ctx.stroke();

  // Soft fill under the line
  ctx.lineTo(x(points.length - 1), h - pad);
  ctx.lineTo(x(0), h - pad);
  ctx.closePath();
  ctx.fillStyle = rising ? 'rgba(47,107,79,0.08)' : 'rgba(181,84,43,0.08)';
  ctx.fill();
}

function updateStatDisplay(points){
  const figure = document.getElementById('statFigure');
  const change = document.getElementById('statChange');
  const latest = points.length ? points[points.length - 1].v : 0;
  figure.textContent = `$${latest.toFixed(2)}`;

  if(points.length < 2){
    change.textContent = '— 0.0%';
    change.className = 'stat-change stat-change--flat';
    return;
  }
  const prev = points[points.length - 2].v;
  const delta = latest - prev;
  const pct = prev !== 0 ? (delta / Math.abs(prev)) * 100 : (delta > 0 ? 100 : 0);
  const arrow = delta > 0 ? '↑' : delta < 0 ? '↓' : '—';
  change.textContent = `${arrow} ${Math.abs(pct).toFixed(1)}%`;
  change.className = 'stat-change ' + (delta > 0 ? 'stat-change--up' : delta < 0 ? 'stat-change--down' : 'stat-change--flat');
}

async function initPortfolio(){
  if(!isConfigured) return;
  const { data: { user } } = await client.auth.getUser();
  if(!user) return;
  currentUserId = user.id;

  const { data } = await client
    .from('transactions')
    .select('delta_amount, created_at')
    .eq('user_id', user.id)
    .order('created_at', { ascending: true });

  portfolioPoints = computeCumulative(data || []);
  drawChart(portfolioPoints);
  updateStatDisplay(portfolioPoints);

  if(portfolioChannel) client.removeChannel(portfolioChannel);
  portfolioChannel = client
    .channel('transactions-' + user.id)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'transactions', filter: `user_id=eq.${user.id}`
    }, (payload) => {
      const last = portfolioPoints.length ? portfolioPoints[portfolioPoints.length - 1].v : 0;
      portfolioPoints.push({ t: new Date(payload.new.created_at), v: last + Number(payload.new.delta_amount) });
      drawChart(portfolioPoints);
      updateStatDisplay(portfolioPoints);
    })
    .subscribe();
}

window.addEventListener('resize', () => drawChart(portfolioPoints));

// ============================================================
// Invest / Withdraw — amount modal wired to the transactions ledger
// ============================================================
const amountModal = document.getElementById('amountModal');
const amountModalTitle = document.getElementById('amountModalTitle');
const amountInput = document.getElementById('amountInput');
const amountError = document.getElementById('amountError');
const ecocashToggleRow = document.getElementById('ecocashToggleRow');
const ecocashToggle = document.getElementById('ecocashToggle');
const ecocashPhoneField = document.getElementById('ecocashPhoneField');
const ecocashPhone = document.getElementById('ecocashPhone');
const ecocashInstructions = document.getElementById('ecocashInstructions');
let pendingTxKind = 'buy';
let pendingStoreId = null;
let ecocashPollTimer = null;

function openAmountModal(kind, storeId){
  pendingTxKind = kind;
  pendingStoreId = storeId || null;
  amountModalTitle.textContent = kind === 'deposit' ? 'Invest' : kind === 'buy' ? 'Buy shares' : 'Withdraw';
  amountInput.value = '';
  amountError.hidden = true;
  ecocashInstructions.hidden = true;
  ecocashToggle.checked = false;
  ecocashPhoneField.hidden = true;
  // EcoCash only makes sense for money coming IN (Invest / Buy), not withdrawals.
  ecocashToggleRow.hidden = (kind === 'withdraw');
  amountModal.hidden = false;
  amountInput.focus();
}

ecocashToggle.addEventListener('change', () => {
  ecocashPhoneField.hidden = !ecocashToggle.checked;
});

document.getElementById('investBtn').addEventListener('click', () => openAmountModal('deposit'));
document.getElementById('withdrawBtn').addEventListener('click', () => openAmountModal('withdraw'));
document.getElementById('amountCancelBtn').addEventListener('click', () => {
  amountModal.hidden = true;
  if(ecocashPollTimer) clearInterval(ecocashPollTimer);
});

async function payWithEcocash(amt){
  const phone = ecocashPhone.value.trim();
  if(!phone){
    amountError.textContent = 'Enter the EcoCash number to charge.';
    amountError.hidden = false;
    return;
  }
  const confirmBtn = document.getElementById('amountConfirmBtn');
  confirmBtn.disabled = true;

  try{
    const { data: { session } } = await client.auth.getSession();
    const res = await fetch(`${SUPABASE_URL}/functions/v1/paynow-initiate`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session.access_token}`,
      },
      body: JSON.stringify({ amount: amt, phone }),
    });
    const result = await res.json();

    if(!res.ok || !result.success){
      amountError.textContent = result.error || 'EcoCash payment could not be started.';
      amountError.hidden = false;
      confirmBtn.disabled = false;
      return;
    }

    ecocashInstructions.hidden = false;
    ecocashInstructions.textContent = result.instructions || 'Check your phone and enter your EcoCash PIN to approve the payment.';

    // Poll our own table (not Paynow directly) to see when the webhook
    // confirms payment — the transactions realtime subscription will
    // pick up the actual chart update on its own once that happens.
    const reference = result.reference;
    let attempts = 0;
    ecocashPollTimer = setInterval(async () => {
      attempts++;
      const { data } = await client.from('paynow_payments').select('status').eq('reference', reference).single();
      if(data?.status === 'paid'){
        clearInterval(ecocashPollTimer);
        amountModal.hidden = true;
        confirmBtn.disabled = false;
      } else if(data?.status === 'failed' || attempts > 40){ // ~2 min at 3s intervals
        clearInterval(ecocashPollTimer);
        amountError.textContent = data?.status === 'failed' ? 'Payment failed or was cancelled.' : 'Still waiting on confirmation — check back shortly.';
        amountError.hidden = false;
        confirmBtn.disabled = false;
      }
    }, 3000);

  }catch(e){
    amountError.textContent = 'Could not reach the payment service — try again.';
    amountError.hidden = false;
    confirmBtn.disabled = false;
  }
}

document.getElementById('amountConfirmBtn').addEventListener('click', async () => {
  const amt = parseFloat(amountInput.value);
  amountError.hidden = true;

  if(!amt || amt <= 0){
    amountError.textContent = 'Enter an amount greater than $0.';
    amountError.hidden = false;
    return;
  }
  const currentValue = portfolioPoints.length ? portfolioPoints[portfolioPoints.length - 1].v : 0;
  if(pendingTxKind === 'withdraw' && amt > currentValue){
    amountError.textContent = `You can't withdraw more than your current balance ($${currentValue.toFixed(2)}).`;
    amountError.hidden = false;
    return;
  }
  if(!isConfigured || !currentUserId){
    amountError.textContent = 'Backend not connected — nothing to record yet.';
    amountError.hidden = false;
    return;
  }

  // EcoCash path — real money movement, goes through the Edge Function,
  // not a direct table insert (a browser insert here could never be trusted).
  if(ecocashToggle.checked && !ecocashToggleRow.hidden){
    await payWithEcocash(amt);
    return;
  }

  try{
    await client.from('transactions').insert({
      user_id: currentUserId,
      kind: pendingTxKind,
      delta_amount: pendingTxKind === 'withdraw' ? -amt : amt,
      store_id: pendingStoreId,
    });
    amountModal.hidden = true;
    // The realtime subscription above will pick up this insert and
    // update the chart/figure automatically — no manual refresh needed.
  }catch(e){
    amountError.textContent = 'Something went wrong recording that — try again.';
    amountError.hidden = false;
  }
});

// ============================================================
// Profile — greeting, header avatar, profile panel
// ============================================================
async function loadProfile(){
  if(!isConfigured) return;
  try{
    const { data: { user } } = await client.auth.getUser();
    if(!user) return;
    const { data: profile } = await client.from('profiles').select('full_name, verification_status, is_admin').eq('id', user.id).single();

    const name = profile?.full_name || 'Gardener';
    const initials2 = initials(name);
    const status = profile?.verification_status || 'unverified';

    document.getElementById('greetingName').textContent = `Welcome back, ${name.split(' ')[0]}`;
    document.getElementById('headerInitials').textContent = initials2;
    document.getElementById('panelInitials').textContent = initials2;
    document.getElementById('panelName').textContent = name;
    document.getElementById('panelEmail').textContent = user.email || '';
    document.getElementById('panelStatus').textContent = status.charAt(0).toUpperCase() + status.slice(1);

    const ringCls = ringClass(status);
    document.getElementById('headerRing').className = ringCls;
    document.getElementById('panelRing').className = ringCls;

    await loadOwnStore(user.id);
    if(profile?.is_admin) await loadAdminQueue();
  }catch(e){
    // Non-critical — greeting just falls back to its default text.
  }
}

// ============================================================
// Verification — store owner side
// ============================================================
let ownedStore = null;

async function loadOwnStore(userId){
  const { data } = await client.from('stores').select('id, name, verification_status').eq('owner_id', userId).limit(1).maybeSingle();
  const block = document.getElementById('verifyBlock');
  if(!data){ block.hidden = true; return; }

  ownedStore = data;
  block.hidden = false;
  document.getElementById('verifyStoreName').textContent = data.name;
  document.getElementById('verifyStoreStatus').textContent =
    data.verification_status.charAt(0).toUpperCase() + data.verification_status.slice(1);

  const btn = document.getElementById('requestVerifyBtn');
  const note = document.getElementById('verifyNote');
  note.hidden = true;

  if(data.verification_status === 'verified'){
    btn.hidden = true;
    note.hidden = false;
    note.textContent = '✓ Your store is verified.';
  } else if(data.verification_status === 'pending'){
    btn.hidden = false;
    btn.disabled = true;
    btn.textContent = 'Review pending';
  } else {
    btn.hidden = false;
    btn.disabled = false;
    btn.textContent = 'Request verification';
  }
}

document.getElementById('requestVerifyBtn').addEventListener('click', async () => {
  if(!ownedStore) return;
  const btn = document.getElementById('requestVerifyBtn');
  btn.disabled = true;
  try{
    const { data: { user } } = await client.auth.getUser();
    await client.from('verification_requests').insert({
      store_id: ownedStore.id,
      submitted_by: user.id,
    });
    await client.from('stores').update({ verification_status: 'pending' }).eq('id', ownedStore.id);
    await loadOwnStore(user.id);
  }catch(e){
    btn.disabled = false;
  }
});

// ============================================================
// Verification — admin review queue
// ============================================================
async function loadAdminQueue(){
  const adminBlock = document.getElementById('adminBlock');
  const list = document.getElementById('adminRequestList');
  const { data } = await client
    .from('verification_requests')
    .select('id, store_id, stores(name)')
    .eq('status', 'pending')
    .order('created_at', { ascending: true });

  if(!data || !data.length){ adminBlock.hidden = true; return; }
  adminBlock.hidden = false;
  list.innerHTML = data.map(r => `
    <div class="admin-request" data-request-id="${r.id}">
      <p class="admin-request-name">${r.stores?.name || 'Unknown store'}</p>
      <div class="admin-request-actions">
        <button class="btn-approve" data-approve="true" data-id="${r.id}">Approve</button>
        <button class="btn-reject" data-approve="false" data-id="${r.id}">Reject</button>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('button[data-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const approve = btn.dataset.approve === 'true';
      btn.closest('.admin-request').style.opacity = '0.5';
      try{
        await client.rpc('review_verification_request', { request_id: id, approve, reason: null });
        await loadAdminQueue();
        if(ownedStore){
          const { data: { user } } = await client.auth.getUser();
          await loadOwnStore(user.id);
        }
      }catch(e){
        btn.closest('.admin-request').style.opacity = '1';
      }
    });
  });
}

document.getElementById('headerAvatarBtn').addEventListener('click', () => navigateTo('profile'));
document.getElementById('logoutBtn').addEventListener('click', async () => {
  if(client) await client.auth.signOut();
});

// ============================================================
// Search — live query against the stores table
// ============================================================
const searchForm = document.getElementById('searchForm');
const searchInput = document.getElementById('searchInput');

async function runSearch(term){
  if(!isConfigured){
    renderStores(sampleData.stores.filter(s => s.name.toLowerCase().includes(term.toLowerCase())));
    return;
  }
  try{
    let query = client.from('stores').select('id, name, category, price_label, verification_status').limit(30);
    if(term) query = query.ilike('name', `%${term}%`);
    const { data } = await query;
    renderStores((data || []).map(s => ({ id: s.id, name: s.name, cat: s.category, price: s.price_label, verified: s.verification_status })));
  }catch(e){ /* leave existing rail as-is on failure */ }
}

searchForm.addEventListener('submit', (e) => {
  e.preventDefault();
  runSearch(searchInput.value.trim());
});

let searchDebounce;
searchInput.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => runSearch(searchInput.value.trim()), 350);
});

// ============================================================
// Quick action grid
// ============================================================
function setActiveTab(tabName){
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('tab--active'));
  const match = document.querySelector(`.tab[data-tab="${tabName}"]`);
  if(match) match.classList.add('tab--active');
}

document.querySelectorAll('.action-card').forEach(btn => {
  btn.addEventListener('click', () => {
    const action = btn.dataset.action;
    if(action === 'invest' || action === 'discover'){
      navigateTo('market');
    } else if(action === 'performance'){
      navigateTo('performance');
    } else if(action === 'tasks'){
      navigateTo('tasks');
    }
  });
});

async function initAuth(){
  if(!isConfigured){
    // No backend yet — let the person see the built UI in a preview state.
    showApp();
    return;
  }
  const { data: { session } } = await client.auth.getSession();
  session ? showApp() : showAuth();

  client.auth.onAuthStateChange((_event, session) => {
    session ? showApp() : showAuth();
  });
}

// ============================================================
// Create modal — post to community / post a task / create a store
// ============================================================
const createModal = document.getElementById('createModal');
let activeCreateTab = 'post';

function openCreateModal(){
  activeCreateTab = 'post';
  document.querySelectorAll('#createTabs .auth-tab').forEach(t => t.classList.remove('auth-tab--active'));
  document.querySelector('#createTabs [data-create="post"]').classList.add('auth-tab--active');
  document.getElementById('createPostForm').hidden = false;
  document.getElementById('createTaskForm').hidden = true;
  document.getElementById('createStoreForm').hidden = true;
  document.getElementById('createError').hidden = true;
  document.getElementById('createConfirmBtn').textContent = 'Post';

  // Hide the "Store" tab entirely once the person already owns one —
  // this app supports one store per owner for now.
  document.getElementById('createStoreTab').hidden = !!ownedStore;

  createModal.hidden = false;
}

document.querySelectorAll('#createTabs .auth-tab').forEach(tabBtn => {
  tabBtn.addEventListener('click', () => {
    activeCreateTab = tabBtn.dataset.create;
    document.querySelectorAll('#createTabs .auth-tab').forEach(t => t.classList.remove('auth-tab--active'));
    tabBtn.classList.add('auth-tab--active');
    document.getElementById('createPostForm').hidden = activeCreateTab !== 'post';
    document.getElementById('createTaskForm').hidden = activeCreateTab !== 'task';
    document.getElementById('createStoreForm').hidden = activeCreateTab !== 'store';
    document.getElementById('createError').hidden = true;
    document.getElementById('createConfirmBtn').textContent =
      activeCreateTab === 'post' ? 'Post' : activeCreateTab === 'task' ? 'Post task' : 'Create store';
  });
});

document.getElementById('createCancelBtn').addEventListener('click', () => { createModal.hidden = true; });

document.getElementById('createConfirmBtn').addEventListener('click', async () => {
  const errEl = document.getElementById('createError');
  errEl.hidden = true;

  if(!isConfigured || !currentUserId){
    errEl.textContent = 'Backend not connected — nothing to save yet.';
    errEl.hidden = false;
    return;
  }

  try{
    if(activeCreateTab === 'post'){
      const body = document.getElementById('postBody').value.trim();
      if(!body){ errEl.textContent = 'Write something first.'; errEl.hidden = false; return; }
      await client.from('posts').insert({ author_id: currentUserId, body });
      document.getElementById('postBody').value = '';
      await loadFeed();

    } else if(activeCreateTab === 'task'){
      const title = document.getElementById('taskTitle').value.trim();
      const loc = document.getElementById('taskLocation').value.trim();
      const pay = parseFloat(document.getElementById('taskPay').value);
      if(!title || !loc || !pay || pay <= 0){
        errEl.textContent = 'Fill in a title, location, and a pay amount above $0.';
        errEl.hidden = false;
        return;
      }
      await client.from('tasks').insert({ posted_by: currentUserId, title, location_label: loc, pay_amount: pay, status: 'open' });
      document.getElementById('taskTitle').value = '';
      document.getElementById('taskLocation').value = '';
      document.getElementById('taskPay').value = '';
      await loadFeed();

    } else if(activeCreateTab === 'store'){
      const name = document.getElementById('storeName').value.trim();
      const category = document.getElementById('storeCategory').value.trim();
      const price = document.getElementById('storePrice').value.trim();
      if(!name || !category || !price){
        errEl.textContent = 'Fill in a name, category, and price for your store.';
        errEl.hidden = false;
        return;
      }
      await client.from('stores').insert({ owner_id: currentUserId, name, category, price_label: price, verification_status: 'unverified' });
      document.getElementById('storeName').value = '';
      document.getElementById('storeCategory').value = '';
      document.getElementById('storePrice').value = '';
      await loadFeed();
      await loadOwnStore(currentUserId);
    }
    createModal.hidden = true;
  }catch(e){
    errEl.textContent = 'Something went wrong saving that — try again.';
    errEl.hidden = false;
  }
});

document.addEventListener('DOMContentLoaded', () => {
  if(clientError){
    authError.textContent = clientError;
    authError.style.color = 'var(--clay)';
    authError.style.background = 'rgba(181,84,43,0.1)';
    authError.hidden = false;
  }
  initAuth();
  updateOfflineBanner();

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const tabName = btn.dataset.tab;
      if(tabName === 'home'){
        navigateTo('home');
      } else if(tabName === 'search'){
        navigateTo('market');
        setActiveTab('search');
        searchInput.focus();
      } else if(tabName === 'market'){
        navigateTo('market');
      } else if(tabName === 'performance'){
        navigateTo('performance');
      } else if(tabName === 'profile'){
        navigateTo('profile');
      } else if(tabName === 'create'){
        openCreateModal();
      }
    });
  });
});

// Register service worker for offline shell caching.
// No-ops safely in sandboxed preview contexts that block SW scope registration.
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
